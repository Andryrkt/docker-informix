server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le build Docusaurus est genere avec baseUrl=/docs/, donc les fichiers
    # vivent deja sous /usr/share/nginx/html/docs/.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
