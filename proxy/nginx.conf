server {
    listen 80;
    server_name _;

    # Aligne avec upload_max_filesize/post_max_size (10M) du backend PHP
    client_max_body_size 12m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend Symfony (toutes les routes API sont prefixees /api/...)
    location /api/ {
        proxy_pass http://backend:80;
    }

    # Documentation Docusaurus (build genere avec baseUrl=/docs/)
    location /docs/ {
        proxy_pass http://docs:80;
    }

    # Frontend React (SPA, catch-all)
    location / {
        proxy_pass http://frontend:80;
    }
}
