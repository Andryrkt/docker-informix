# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $dbIps: '%env(resolve:INFORMIX_DB)%'
            $dbIrium: '%env(resolve:INFORMIX_DB_IRIUM)%'
            $ldapUrl: '%env(resolve:LDAP_URL)%'
            $ldapSearchDn: '%env(resolve:LDAP_SEARCH_DN)%'
            $ldapSearchPassword: '%env(resolve:LDAP_SEARCH_PASSWORD)%'
            $ldapBaseDn: '%env(resolve:LDAP_BASE_DN)%'
            $ldapDomain: '%env(resolve:LDAP_DOMAIN)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Gestion multi-entity manager : on force SQL Server pour la sécurité
    App\Security\:
        resource: '../src/Security/'
        bind:
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.sqlserver_entity_manager'

    # Audit : les repositories utilisent le ManagerRegistry (autowired).
    # AuditService utilise DBAL directement via la connexion SQL Server.
    App\Audit\:
        resource: '../src/Audit/'

    # AuditService : injection explicite de la connexion DBAL SQL Server
    # (DBAL ne se ferme pas sur un INSERT raté, contrairement à l'EntityManager)
    App\Audit\Service\AuditService:
        bind:
            Doctrine\DBAL\Connection: '@doctrine.dbal.sqlserver_connection'

    # Notification : idem AuditService, connexion DBAL SQL Server explicite
    # (le contrôleur lit/écrit via l'ORM — l'entité Notification est mappée sur sqlserver)
    App\Notification\:
        resource: '../src/Notification/'
        bind:
            Doctrine\DBAL\Connection: '@doctrine.dbal.sqlserver_connection'
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.sqlserver_entity_manager'
            $mailerFrom: '%env(MAILER_FROM)%'

    # It : lecture via l'ORM (mappé sur sqlserver), écriture via DBAL direct —
    # le driver SQL Server custom ne convertit pas correctement un DateTime lié
    # en paramètre via l'ORM (cf. AuditService/NotificationService, même limitation).
    App\It\:
        resource: '../src/It/'
        bind:
            Doctrine\ORM\EntityManagerInterface: '@doctrine.orm.sqlserver_entity_manager'
            Doctrine\DBAL\Connection: '@doctrine.dbal.sqlserver_connection'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Symfony\Component\Ldap\Ldap:
        factory: ['Symfony\Component\Ldap\Ldap', 'create']
        arguments:
            - 'ext_ldap'
            - connection_string: '%env(resolve:LDAP_URL)%'
              referrals: false
